org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true

# Single source of truth for Library releases. A push to main publishes only when this
# semantic version is higher than the newest existing vX.Y.Z GitHub Release.
LIBRARY_VERSION=1.0.3

# AGP 9 still supports the explicit Kotlin plugin used by Compose 2.3.21.
# Keep both flags together; migrate to AGP built-in Kotlin before AGP 10.
android.builtInKotlin=false
android.newDsl=false
