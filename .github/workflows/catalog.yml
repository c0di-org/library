name: Refresh Catalog

on:
  # Repository changes that affect catalog generation exercise the publisher immediately.
  push:
    branches: [main]
    paths:
      - '.github/workflows/catalog.yml'
      - 'catalog/**'
      - 'config/**'
      - 'scripts/build_catalog.py'
      - 'scripts/sync_github.py'
      - 'scripts/sync_github_installation.py'
      - 'scripts/validate_catalog.py'
  # Recovery only. Normal app updates arrive from the GitHub App via workflow_dispatch.
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      source_repository:
        description: Repository whose release triggered this refresh
        required: false
        type: string
      release_id:
        description: GitHub release ID that triggered this refresh
        required: false
        type: string
      release_tag:
        description: GitHub release tag that triggered this refresh
        required: false
        type: string
      delivery_id:
        description: GitHub webhook delivery ID
        required: false
        type: string

permissions:
  contents: write
  statuses: write

concurrency:
  group: library-catalog
  cancel-in-progress: true

jobs:
  refresh:
    # Defense in depth: the deployed webhook may still echo Library's own catalog
    # release event back into this workflow. Never reconcile a catalog release.
    if: >-
      ${{ !(github.event_name == 'workflow_dispatch' &&
            inputs.source_repository == github.repository &&
            (inputs.release_tag == 'catalog' || startsWith(inputs.release_tag, 'catalog-'))) }}
    environment: production
    runs-on: [self-hosted, linux, nucchuck]
    timeout-minutes: 45
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
      LIBRARY_GITHUB_OWNER: ${{ github.repository_owner }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v5

      - name: Test catalog discovery helpers
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Mint Library Catalog App token
        id: catalog-app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.LIBRARY_CATALOG_APP_CLIENT_ID }}
          private-key: ${{ secrets.LIBRARY_CATALOG_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: read

      - name: Trigger context
        if: ${{ inputs.source_repository != '' }}
        env:
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          RELEASE_ID: ${{ inputs.release_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          DELIVERY_ID: ${{ inputs.delivery_id }}
        run: |
          printf 'Catalog refresh requested by %s (%s, release %s, delivery %s)\n' \
            "$SOURCE_REPOSITORY" "$RELEASE_TAG" "$RELEASE_ID" "$DELIVERY_ID"

      - uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install APK inspection tools
        run: sdkmanager "build-tools;36.0.0"

      - name: Restore previous catalog snapshot
        id: previous-catalog
        shell: bash
        run: |
          set -euo pipefail
          CACHE_DIR="$RUNNER_TEMP/library-catalog-previous"
          rm -rf "$CACHE_DIR"
          mkdir -p "$CACHE_DIR"

          CATALOG_TAG="$(
            gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq '[.[] | select(.draft == false) | select(.tag_name | startswith("catalog-"))][0].tag_name // ""'
          )"
          if [[ -z "$CATALOG_TAG" ]]; then
            echo "No previous versioned catalog release found; APKs will be inspected normally."
            exit 0
          fi

          gh release download "$CATALOG_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern catalog.json \
            --dir "$CACHE_DIR"

          echo "path=$CACHE_DIR/catalog.json" >> "$GITHUB_OUTPUT"
          echo "tag=$CATALOG_TAG" >> "$GITHUB_OUTPUT"
          echo "Restored previous catalog snapshot from $CATALOG_TAG"

      - name: Discover GitHub APK releases
        env:
          LIBRARY_GITHUB_TOKEN: ${{ steps.catalog-app.outputs.token }}
          LIBRARY_PREVIOUS_CATALOG: ${{ steps.previous-catalog.outputs.path }}
        run: |
          python3 scripts/sync_github_installation.py
          python3 scripts/build_catalog.py
          python3 scripts/validate_catalog.py catalog/library.json

      - name: Detect catalog changes
        id: catalog-changes
        shell: bash
        env:
          PREVIOUS_CATALOG: ${{ steps.previous-catalog.outputs.path }}
        run: |
          set -euo pipefail
          if [[ -z "${PREVIOUS_CATALOG:-}" || ! -f "$PREVIOUS_CATALOG" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "No previous catalog snapshot to compare; publication is required."
            exit 0
          fi

          python3 - "$PREVIOUS_CATALOG" catalog/library.json "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys

          previous_path, current_path, output_path = sys.argv[1:]
          with open(previous_path, encoding="utf-8") as handle:
              previous = json.load(handle)
          with open(current_path, encoding="utf-8") as handle:
              current = json.load(handle)

          keys = ("schemaVersion", "name", "apps")
          changed = any(previous.get(key) != current.get(key) for key in keys)
          with open(output_path, "a", encoding="utf-8") as handle:
              handle.write(f"changed={'true' if changed else 'false'}\n")
          print("Catalog content changed." if changed else "Catalog content is already current.")
          PY

      - name: Publish versioned catalog release
        if: ${{ steps.catalog-changes.outputs.changed == 'true' }}
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          CATALOG_TAG="catalog-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          GENERATED_AT="$(python3 - <<'PY'
          import json
          with open('catalog/library.json', encoding='utf-8') as handle:
              print(json.load(handle)['generatedAt'])
          PY
          )"
          cp catalog/library.json "$RUNNER_TEMP/catalog.json"

          if gh release view "$CATALOG_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Catalog release $CATALOG_TAG already exists; refusing to overwrite an immutable catalog release." >&2
            exit 1
          fi

          gh release create "$CATALOG_TAG" \
            "$RUNNER_TEMP/catalog.json" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Library Catalog $GENERATED_AT" \
            --notes "Machine-generated Library catalog from workflow run $GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT." \
            --latest=false

          echo "tag=$CATALOG_TAG" >> "$GITHUB_OUTPUT"
          echo "Published immutable catalog release $CATALOG_TAG"

      - name: Verify published catalog release
        if: ${{ steps.catalog-changes.outputs.changed == 'true' }}
        shell: bash
        env:
          CATALOG_TAG: ${{ steps.publish.outputs.tag }}
        run: |
          set -euo pipefail
          test -n "$CATALOG_TAG"
          VERIFY_DIR="$RUNNER_TEMP/catalog-release-verify"
          rm -rf "$VERIFY_DIR"
          mkdir -p "$VERIFY_DIR"
          gh release download "$CATALOG_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern catalog.json \
            --dir "$VERIFY_DIR"
          cmp catalog/library.json "$VERIFY_DIR/catalog.json"
          echo "Verified $CATALOG_TAG contains the generated catalog.json"

      - name: Upload catalog workflow artifact
        if: ${{ steps.catalog-changes.outputs.changed == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: library-catalog-${{ github.run_id }}-${{ github.run_attempt }}
          path: catalog/library.json
          retention-days: 14

      - name: Record catalog publication status
        if: ${{ always() }}
        continue-on-error: true
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          CATALOG_CHANGED: ${{ steps.catalog-changes.outputs.changed }}
          CATALOG_TAG: ${{ steps.publish.outputs.tag }}
          PREVIOUS_CATALOG_TAG: ${{ steps.previous-catalog.outputs.tag }}
        run: |
          set -euo pipefail
          STATE=failure
          DESCRIPTION="Catalog release failed"
          if [[ "$JOB_STATUS" == "success" ]]; then
            STATE=success
            if [[ "$CATALOG_CHANGED" == "true" ]]; then
              DESCRIPTION="Versioned catalog release published and verified"
            else
              DESCRIPTION="Catalog already current"
            fi
          elif [[ "$JOB_STATUS" == "cancelled" ]]; then
            STATE=error
            DESCRIPTION="Catalog release cancelled"
          fi

          STATUS_TAG="$CATALOG_TAG"
          if [[ -z "$STATUS_TAG" && "$CATALOG_CHANGED" != "true" ]]; then
            STATUS_TAG="$PREVIOUS_CATALOG_TAG"
          fi

          ARGS=(
            --method POST
            "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA"
            -f "state=$STATE"
            -f "context=library/catalog-publish"
            -f "description=$DESCRIPTION"
          )
          if [[ -n "$STATUS_TAG" ]]; then
            ARGS+=( -f "target_url=https://github.com/$GITHUB_REPOSITORY/releases/tag/$STATUS_TAG" )
          fi
          gh api "${ARGS[@]}"
