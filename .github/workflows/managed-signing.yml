name: Managed APK Signing

on:
  workflow_dispatch:
    inputs:
      source_repository:
        description: Managed repository whose build produced an unsigned APK
        required: false
        type: string
      source_run_id:
        description: Source workflow run ID that produced the artifact
        required: false
        type: string
      source_artifact_id:
        description: Source unsigned APK artifact ID
        required: false
        type: string
      source_head_sha:
        description: Source commit whose .library.json declares repo-side enrollment
        required: false
        type: string
      delivery_id:
        description: GitHub webhook delivery ID
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: library-managed-signing
  cancel-in-progress: false

jobs:
  sign:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LIBRARY_GITHUB_OWNER: ${{ github.repository_owner }}
      LIBRARY_GITHUB_TOKEN: ${{ secrets.LIBRARY_GITHUB_TOKEN }}
      LIBRARY_DISTRIBUTION_STORE_PASSWORD: ${{ secrets.LIBRARY_DISTRIBUTION_STORE_PASSWORD }}
      LIBRARY_DISTRIBUTION_KEY_ALIAS: ${{ secrets.LIBRARY_DISTRIBUTION_KEY_ALIAS }}
      LIBRARY_DISTRIBUTION_KEY_PASSWORD: ${{ secrets.LIBRARY_DISTRIBUTION_KEY_PASSWORD }}
      SOURCE_REPOSITORY: ${{ inputs.source_repository }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      SOURCE_ARTIFACT_ID: ${{ inputs.source_artifact_id }}
      SOURCE_HEAD_SHA: ${{ inputs.source_head_sha }}
      DELIVERY_ID: ${{ inputs.delivery_id }}
    steps:
      - uses: actions/checkout@v5

      - name: Resolve managed app enrollment
        id: enrollment
        run: python3 scripts/resolve_managed_app.py

      - uses: android-actions/setup-android@v3
        if: steps.enrollment.outputs.enabled == 'true'

      - name: Install APK signing tools
        if: steps.enrollment.outputs.enabled == 'true'
        run: sdkmanager "build-tools;36.0.0"

      - name: Require managed-signing secrets
        if: steps.enrollment.outputs.enabled == 'true'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.LIBRARY_DISTRIBUTION_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 LIBRARY_GITHUB_TOKEN LIBRARY_DISTRIBUTION_STORE_PASSWORD LIBRARY_DISTRIBUTION_KEY_ALIAS LIBRARY_DISTRIBUTION_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing managed-signing secret: $name" >&2
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/library-distribution.jks"
          chmod 600 "$RUNNER_TEMP/library-distribution.jks"
          echo "LIBRARY_DISTRIBUTION_KEYSTORE_FILE=$RUNNER_TEMP/library-distribution.jks" >> "$GITHUB_ENV"

      - name: Sign and publish requested app artifact
        if: steps.enrollment.outputs.enabled == 'true'
        run: python3 scripts/manage_unsigned_apks.py

      - name: Verify refreshed catalog after publication
        if: steps.enrollment.outputs.enabled == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/sync_github.py
          python3 scripts/build_catalog.py
          python3 scripts/validate_catalog.py catalog/library.json
