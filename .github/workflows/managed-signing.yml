name: Managed APK Signing

on:
  workflow_dispatch:
    inputs:
      source_repository:
        description: Managed repository whose completed workflow produced the unsigned APK
        required: true
        type: string
      source_run_id:
        description: Exact source workflow run ID validated by the automation GitHub App
        required: true
        type: string
      source_artifact_id:
        description: Exact unsigned APK artifact ID validated by the automation GitHub App
        required: true
        type: string
      source_head_sha:
        description: Exact source commit for the validated workflow run
        required: true
        type: string
      delivery_id:
        description: GitHub webhook delivery ID
        required: false
        type: string

permissions:
  contents: read
  statuses: write

concurrency:
  group: library-managed-signing
  cancel-in-progress: false

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SOURCE_REPOSITORY: ${{ inputs.source_repository }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
    steps:
      - name: Record managed-signing dispatch
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APP_NAME="${SOURCE_REPOSITORY##*/}"
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="pending" \
            -f context="library/managed-signing/$APP_NAME" \
            -f description="$APP_NAME signer dispatch accepted" \
            -f target_url="https://github.com/$SOURCE_REPOSITORY/actions/runs/$SOURCE_RUN_ID"

  sign:
    needs: trace
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LIBRARY_GITHUB_OWNER: ${{ github.repository_owner }}
      LIBRARY_DISTRIBUTION_STORE_PASSWORD: ${{ secrets.LIBRARY_DISTRIBUTION_STORE_PASSWORD }}
      LIBRARY_DISTRIBUTION_KEY_ALIAS: ${{ secrets.LIBRARY_DISTRIBUTION_KEY_ALIAS }}
      LIBRARY_DISTRIBUTION_KEY_PASSWORD: ${{ secrets.LIBRARY_DISTRIBUTION_KEY_PASSWORD }}
      SOURCE_REPOSITORY: ${{ inputs.source_repository }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      SOURCE_ARTIFACT_ID: ${{ inputs.source_artifact_id }}
      SOURCE_HEAD_SHA: ${{ inputs.source_head_sha }}
      DELIVERY_ID: ${{ inputs.delivery_id }}
    steps:
      - uses: actions/checkout@v5

      - name: Mint source GitHub App token
        id: signing-app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.LIBRARY_CATALOG_APP_CLIENT_ID }}
          private-key: ${{ secrets.LIBRARY_CATALOG_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: write
          permission-actions: read

      - name: Resolve managed app enrollment
        id: enrollment
        env:
          LIBRARY_GITHUB_TOKEN: ${{ steps.signing-app.outputs.token }}
        run: python3 scripts/resolve_managed_app.py

      - uses: android-actions/setup-android@v3

      - name: Install APK signing tools
        id: signing-tools
        run: sdkmanager "build-tools;36.0.0"

      - name: Require managed-signing secrets
        id: secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.LIBRARY_DISTRIBUTION_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 LIBRARY_DISTRIBUTION_STORE_PASSWORD LIBRARY_DISTRIBUTION_KEY_ALIAS LIBRARY_DISTRIBUTION_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing managed-signing secret: $name" >&2
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/library-distribution.jks"
          chmod 600 "$RUNNER_TEMP/library-distribution.jks"
          echo "LIBRARY_DISTRIBUTION_KEYSTORE_FILE=$RUNNER_TEMP/library-distribution.jks" >> "$GITHUB_ENV"

      - name: Sign and publish validated source artifact
        id: publish
        env:
          LIBRARY_GITHUB_TOKEN: ${{ steps.signing-app.outputs.token }}
        run: python3 scripts/manage_unsigned_apks.py

      - name: Record managed-signing status
        if: ${{ always() }}
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ENROLLMENT_OUTCOME: ${{ steps.enrollment.outcome }}
          TOOLS_OUTCOME: ${{ steps.signing-tools.outcome }}
          SECRETS_OUTCOME: ${{ steps.secrets.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        run: |
          set -euo pipefail
          APP_NAME="${SOURCE_REPOSITORY##*/}"
          STATE=failure
          DESCRIPTION="$APP_NAME managed signing workflow failed"

          if [[ "$ENROLLMENT_OUTCOME" != "success" ]]; then
            DESCRIPTION="$APP_NAME enrollment resolution failed"
          elif [[ "$TOOLS_OUTCOME" != "success" ]]; then
            DESCRIPTION="$APP_NAME signing-tool setup failed"
          elif [[ "$SECRETS_OUTCOME" != "success" ]]; then
            DESCRIPTION="$APP_NAME managed-signing credential check failed"
          elif [[ "$PUBLISH_OUTCOME" == "success" ]]; then
            STATE=success
            DESCRIPTION="$APP_NAME signed release published"
          elif [[ "$PUBLISH_OUTCOME" == "failure" ]]; then
            DESCRIPTION="$APP_NAME signing or release publication failed"
          fi

          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$STATE" \
            -f context="library/managed-signing/$APP_NAME" \
            -f description="$DESCRIPTION" \
            -f target_url="https://github.com/$SOURCE_REPOSITORY/actions/runs/$SOURCE_RUN_ID"
