name: Apply responsive UX once

on:
  push:
    branches:
      - improve-tablet-desktop-ux

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Apply responsive UX and bump version
        run: python3 scripts/apply_responsive_once.py

      - name: Check diff
        run: git diff --check

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Lint, test, and build
        run: gradle --no-daemon lintDebug testDebugUnitTest assembleDebug

      - name: Commit generated app changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- app/src/main/java/com/garfbargle/library/ui/LibraryApp.kt app/src/main/AndroidManifest.xml gradle.properties
          git diff --cached --exit-code && { echo "No generated changes" >&2; exit 1; } || true
          git commit -m "Improve tablet and desktop UX"
          git push origin HEAD:improve-tablet-desktop-ux
