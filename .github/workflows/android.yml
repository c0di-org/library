name: Android CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Validate helper scripts
        run: |
          python3 -m py_compile scripts/*.py
          for script in scripts/*.sh; do bash -n "$script"; done
          python3 - <<'PY'
          from pathlib import Path
          from scripts.manage_unsigned_apks import load_config
          load_config(Path("config/managed-apps.json"))
          PY

      - name: Validate bundled catalog
        run: |
          python3 scripts/build_catalog.py --updated-at 2026-08-15 --generated-at 2026-08-16T03:45:00Z
          python3 scripts/validate_catalog.py catalog/library.json
          git diff --exit-code -- catalog/library.json app/src/main/assets/catalog.json

      - name: Lint, test, and build
        run: gradle --no-daemon lintDebug testDebugUnitTest assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: library-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
