name: Apply GitHub setup UX

on:
  push:
    branches:
      - fix/catalog-public-fallback-1.0.11
    paths:
      - .github/workflows/_settings-ux-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/catalog-public-fallback-1.0.11
          fetch-depth: 0

      - uses: android-actions/setup-android@v3

      - name: Add minimal GitHub token setup guide
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/src/main/java/com/garfbargle/library/ui/LibraryApp.kt")
          text = path.read_text()
          start = text.index("@Composable\nprivate fun SettingsScreen(")
          end = text.index("\n@Composable\nprivate fun Notice(", start)

          replacement = r'''@Composable
          private fun SettingsScreen(
              hasToken: Boolean,
              warning: String?,
              onSave: (String) -> Unit,
              onClear: () -> Unit,
              onRefresh: () -> Unit,
              padding: PaddingValues,
              wideLayout: Boolean
          ) {
              var token by remember { mutableStateOf("") }
              var showSetup by rememberSaveable(hasToken) { mutableStateOf(!hasToken) }
              val context = LocalContext.current
              val tokenSetupUrl = "https://github.com/settings/personal-access-tokens/new?name=Library&description=Read-only+private+repository+access+for+Library&contents=read"

              BoxWithConstraints(Modifier.fillMaxSize().padding(padding)) {
                  val sidePadding = if (wideLayout) {
                      ((maxWidth - 760.dp) / 2f).coerceAtLeast(32.dp)
                  } else {
                      20.dp
                  }
                  LazyColumn(
                      modifier = Modifier.fillMaxSize(),
                      contentPadding = PaddingValues(start = sidePadding, end = sidePadding, top = 20.dp, bottom = 32.dp),
                      verticalArrangement = Arrangement.spacedBy(16.dp)
                  ) {
                      item {
                          Spacer(Modifier.height(8.dp))
                          Text("Settings", color = TextPrimary, fontSize = 30.sp, fontWeight = FontWeight.Bold)
                          Text("Private access stays on this device.", color = TextSecondary)
                      }
                      item {
                          SectionCard("GitHub") {
                              Row(verticalAlignment = Alignment.CenterVertically) {
                                  Column(Modifier.weight(1f)) {
                                      Text(
                                          if (hasToken) "Private access connected" else "Private repository access",
                                          color = TextPrimary,
                                          fontSize = 14.sp,
                                          fontWeight = FontWeight.SemiBold
                                      )
                                      Text(
                                          if (hasToken) "Used only when a private repository needs it."
                                          else "A fine-grained, read-only token is enough.",
                                          color = TextSecondary,
                                          fontSize = 11.sp
                                      )
                                  }
                                  SettingsPill(
                                      label = if (hasToken) "CONNECTED" else "READ-ONLY",
                                      background = if (hasToken) Acid else Color(0xFF24272C),
                                      foreground = if (hasToken) Ink else TextSecondary
                                  )
                              }

                              Spacer(Modifier.height(14.dp))
                              Row(
                                  Modifier
                                      .fillMaxWidth()
                                      .clip(RoundedCornerShape(16.dp))
                                      .background(Color(0xFF0F1113))
                                      .clickable { showSetup = !showSetup }
                                      .padding(horizontal = 14.dp, vertical = 13.dp),
                                  verticalAlignment = Alignment.CenterVertically
                              ) {
                                  Icon(Icons.Default.Security, null, tint = Acid, modifier = Modifier.size(19.dp))
                                  Spacer(Modifier.width(11.dp))
                                  Column(Modifier.weight(1f)) {
                                      Text("How to set it up", color = TextPrimary, fontSize = 13.sp, fontWeight = FontWeight.SemiBold)
                                      Text("Contents · Read-only", color = TextSecondary, fontSize = 10.sp)
                                  }
                                  Icon(
                                      if (showSetup) Icons.Default.ExpandLess else Icons.Default.ExpandMore,
                                      contentDescription = if (showSetup) "Hide GitHub setup" else "Show GitHub setup",
                                      tint = TextSecondary,
                                      modifier = Modifier.size(20.dp)
                                  )
                              }

                              if (showSetup) {
                                  Spacer(Modifier.height(10.dp))
                                  GitHubSetupGuide(onCreateToken = { openUrl(context, tokenSetupUrl) })
                              }

                              Spacer(Modifier.height(14.dp))
                              if (!hasToken) {
                                  OutlinedTextField(
                                      value = token,
                                      onValueChange = { token = it },
                                      modifier = Modifier.fillMaxWidth(),
                                      label = { Text("Paste token") },
                                      placeholder = { Text("github_pat_…") },
                                      singleLine = true,
                                      visualTransformation = PasswordVisualTransformation()
                                  )
                                  Spacer(Modifier.height(10.dp))
                                  Button(
                                      onClick = { if (token.isNotBlank()) { onSave(token.trim()); token = "" } },
                                      modifier = Modifier.fillMaxWidth(),
                                      shape = RoundedCornerShape(16.dp)
                                  ) { Text("Connect GitHub") }
                              } else {
                                  Row(verticalAlignment = Alignment.CenterVertically) {
                                      Icon(Icons.Default.CheckCircle, null, tint = Acid, modifier = Modifier.size(19.dp))
                                      Spacer(Modifier.width(8.dp))
                                      Text("Stored with Android Keystore", color = TextPrimary, fontSize = 12.sp)
                                  }
                                  Spacer(Modifier.height(12.dp))
                                  Button(
                                      onClick = onClear,
                                      colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF292B30)),
                                      modifier = Modifier.fillMaxWidth(),
                                      shape = RoundedCornerShape(16.dp)
                                  ) { Text("Disconnect") }
                              }
                          }
                      }
                      item {
                          SectionCard("Catalog") {
                              Text(BuildConfig.CATALOG_REPOSITORY, color = TextSecondary, fontSize = 12.sp)
                              warning?.let {
                                  Spacer(Modifier.height(8.dp))
                                  Text(it, color = MaterialTheme.colorScheme.error, fontSize = 11.sp)
                              }
                              Spacer(Modifier.height(12.dp))
                              Button(onClick = onRefresh, modifier = Modifier.fillMaxWidth(), shape = RoundedCornerShape(16.dp)) {
                                  Icon(Icons.Default.Refresh, null)
                                  Spacer(Modifier.width(8.dp))
                                  Text("Refresh")
                              }
                          }
                      }
                      item {
                          SectionCard("Library ${BuildConfig.VERSION_NAME}") {
                              Text(
                                  "Library verifies every APK before installation and keeps each app's signing identity intact.",
                                  color = TextSecondary,
                                  fontSize = 13.sp
                              )
                          }
                      }
                  }
              }
          }

          @Composable
          private fun GitHubSetupGuide(onCreateToken: () -> Unit) {
              Column(
                  Modifier
                      .fillMaxWidth()
                      .clip(RoundedCornerShape(18.dp))
                      .background(Color(0xFF0B0D0F))
                      .padding(15.dp)
              ) {
                  Text(
                      "MINIMUM ACCESS",
                      color = Color(0xFF777A82),
                      fontSize = 9.sp,
                      fontWeight = FontWeight.Black,
                      letterSpacing = 1.4.sp
                  )
                  Spacer(Modifier.height(10.dp))
                  Row(verticalAlignment = Alignment.CenterVertically) {
                      Icon(Icons.Default.CheckCircle, null, tint = Acid, modifier = Modifier.size(18.dp))
                      Spacer(Modifier.width(9.dp))
                      Column(Modifier.weight(1f)) {
                          Text("Contents", color = TextPrimary, fontSize = 13.sp, fontWeight = FontWeight.SemiBold)
                          Text("Repository permission · Read-only", color = TextSecondary, fontSize = 10.sp)
                      }
                      SettingsPill("READ", Color(0xFF1E2A1B), Acid)
                  }
                  Spacer(Modifier.height(10.dp))
                  Text(
                      "Metadata read access is added by GitHub automatically. Library does not need write access, Actions, Issues, Pull requests, or Administration.",
                      color = TextSecondary,
                      fontSize = 11.sp,
                      lineHeight = 16.sp
                  )

                  Spacer(Modifier.height(14.dp))
                  HorizontalDivider(color = Color(0xFF23252A))
                  Spacer(Modifier.height(14.dp))

                  SetupStep(
                      number = "1",
                      title = "Choose the owner",
                      body = "Pick the account or organization that owns your private app repositories. A fine-grained token targets one owner."
                  )
                  SetupStep(
                      number = "2",
                      title = "Select repositories",
                      body = "Use ‘Only select repositories’ and choose just the private repos you want Library to install from."
                  )
                  SetupStep(
                      number = "3",
                      title = "Set Contents to Read-only",
                      body = "Under Repository permissions, set Contents to Read-only. Leave everything else at its default."
                  )
                  SetupStep(
                      number = "4",
                      title = "Generate, then paste",
                      body = "If an organization requires approval, wait until the token is approved before connecting it here."
                  )

                  Spacer(Modifier.height(4.dp))
                  OutlinedButton(
                      onClick = onCreateToken,
                      modifier = Modifier.fillMaxWidth(),
                      shape = RoundedCornerShape(14.dp)
                  ) {
                      Text("Create fine-grained token")
                      Spacer(Modifier.width(8.dp))
                      Icon(Icons.Default.OpenInNew, null, modifier = Modifier.size(16.dp))
                  }
                  Spacer(Modifier.height(8.dp))
                  Text(
                      "GitHub opens with Contents: read pre-filled. Public repositories work without a token.",
                      color = Color(0xFF777A82),
                      fontSize = 10.sp,
                      lineHeight = 14.sp
                  )
              }
          }

          @Composable
          private fun SetupStep(number: String, title: String, body: String) {
              Row(Modifier.padding(bottom = 13.dp)) {
                  Box(
                      Modifier.size(24.dp).clip(CircleShape).background(Color(0xFF24272C)),
                      contentAlignment = Alignment.Center
                  ) {
                      Text(number, color = TextPrimary, fontSize = 10.sp, fontWeight = FontWeight.Bold)
                  }
                  Spacer(Modifier.width(10.dp))
                  Column(Modifier.weight(1f)) {
                      Text(title, color = TextPrimary, fontSize = 12.sp, fontWeight = FontWeight.SemiBold)
                      Spacer(Modifier.height(2.dp))
                      Text(body, color = TextSecondary, fontSize = 10.sp, lineHeight = 15.sp)
                  }
              }
          }

          @Composable
          private fun SettingsPill(label: String, background: Color, foreground: Color) {
              Text(
                  label,
                  color = foreground,
                  fontSize = 9.sp,
                  fontWeight = FontWeight.Black,
                  letterSpacing = 0.7.sp,
                  modifier = Modifier
                      .clip(CircleShape)
                      .background(background)
                      .padding(horizontal = 9.dp, vertical = 5.dp)
              )
          }
          '''.replace("          ", "")

          path.write_text(text[:start] + replacement + text[end:])
          PY

      - name: Compile Kotlin
        run: ./gradlew :app:compileDebugKotlin

      - name: Commit UI update and remove patch workflow
        shell: bash
        run: |
          rm .github/workflows/_settings-ux-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add GitHub token setup guide"
          git push origin HEAD:fix/catalog-public-fallback-1.0.11
