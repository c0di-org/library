name: Apply GitHub App auth migration

on:
  push:
    branches:
      - feature/github-app-auth-1.0.11
    paths:
      - .github/workflows/_apply-github-app-auth.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/github-app-auth-1.0.11
          fetch-depth: 0

      - name: Apply GitHub App migration
        run: python3 scripts/apply_github_app_auth_patch.py

      - uses: android-actions/setup-android@v3

      - name: Compile Android client
        run: ./gradlew :app:compileDebugKotlin

      - name: Validate catalog scripts
        run: python3 -m py_compile scripts/sync_github.py scripts/build_catalog.py scripts/validate_catalog.py

      - name: Commit migration
        shell: bash
        run: |
          rm .github/workflows/_apply-github-app-auth.yml
          rm scripts/apply_github_app_auth_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use GitHub App authentication instead of Android PATs"
          git push origin HEAD:feature/github-app-auth-1.0.11
