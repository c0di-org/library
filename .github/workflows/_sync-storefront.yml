name: Sync storefront PR

on:
  push:
    branches:
      - design/library-storefront
    paths:
      - .github/workflows/_sync-storefront.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: design/library-storefront
          fetch-depth: 0
      - name: Merge main into storefront branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          set +e
          git merge --no-edit origin/main
          status=$?
          set -e
          if [[ $status -ne 0 ]]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            if [[ "$conflicts" != "gradle.properties" ]]; then
              echo "Unexpected merge conflicts:" >&2
              printf '%s\n' "$conflicts" >&2
              exit 1
            fi
            git checkout --ours gradle.properties
            git add gradle.properties
            git commit --no-edit
          fi
          grep -F 'LIBRARY_VERSION=1.0.13' gradle.properties
          git push origin HEAD:design/library-storefront
